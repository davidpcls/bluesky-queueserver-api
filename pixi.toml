[workspace]
authors = ["Dmitri Gavrilov <gavrilov.dvs@gmail.com>"]
channels = ["conda-forge"]
name = "bluesky-queueserver-api"
platforms = ["linux-64"]
version = "0.0.14"

[tasks]

[dependencies]
python = "*"
pip = "*"

[pypi-dependencies]
bluesky-queueserver = { git = "https://github.com/bluesky/bluesky-queueserver.git", branch = "main" }
bluesky-queueserver-api = { path = ".", editable = true, extras = ["dev"] }
bluesky-httpserver = { git = "https://github.com/bluesky/bluesky-httpserver.git", branch = "main" }

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"


[environments]
py311 = { features = ["py311"] }
py312 = { features = ["py312"] }
py313 = { features = ["py313"] }
py314 = { features = ["py314"] }

